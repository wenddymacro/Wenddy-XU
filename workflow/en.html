<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflow Architecture</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>body{margin:0;background:#0f172a}</style></head><body><div id="root"></div>
<script type="text/babel">
const { useState } = React;

const stages = [
  {
    id: 0,
    label: "Stage 0",
    title: "Cognitive\nCrystallization",
    icon: "◈",
    human: ["Research question formulation", "Identification intuition", "Threat assessment", "Null result interpretation"],
    ai: [],
    humanPct: 100,
    tag: "GATE",
    tagColor: "#dc2626",
    desc: "No AI. Researcher writes answers to 4 mandatory questions before any data or AI contact.",
    checkpoint: "Can you explain your identification strategy to a non-economist in one sentence?",
  },
  {
    id: 1,
    label: "Stage 1",
    title: "Ideation",
    icon: "◉",
    human: ["Question selection & importance", "Literature judgment", "Research design taste"],
    ai: ["Literature scanning", "Policy timeline assembly", "Related paper summaries"],
    humanPct: 70,
    tag: "HUMAN-LED",
    tagColor: "#2563eb",
    desc: "AI accelerates search; researcher owns the question.",
    checkpoint: null,
  },
  {
    id: 2,
    label: "Stage 2",
    title: "Design &\nFeasibility",
    icon: "◎",
    human: ["Identification strategy", "Institutional knowledge", "Exogeneity argument", "Threat diagnosis"],
    ai: ["Data availability check", "Preliminary data fetch", "Estimator implementation draft"],
    humanPct: 75,
    tag: "ANALYSIS CONTRACT",
    tagColor: "#7c3aed",
    desc: "Analysis Contract conditions written. Identification logic must exist in researcher's own words.",
    checkpoint: "Condition 1: Method-Data Contract complete?",
  },
  {
    id: 3,
    label: "Stage 3",
    title: "Data\nAssembly",
    icon: "⬡",
    human: ["Source hierarchy design", "Institutional boundary calls", "Coding rule validation", "5–10% spot audit"],
    ai: ["Systematic extraction (DRIL)", "Verbatim citation logging", "Gap documentation", "Cross-run consistency check"],
    humanPct: 35,
    tag: "AI-HEAVY",
    tagColor: "#059669",
    desc: "DRIL architecture: frozen protocol, citation contract, explicit gap records. Human audits sample.",
    checkpoint: "Condition 2: Data Audit complete? Parallel trends plotted?",
  },
  {
    id: 4,
    label: "Stage 4",
    title: "Core\nAnalysis",
    icon: "◆",
    human: ["Primary spec selection (pre-committed)", "Assumption verification", "Cluster level justification", "Result interpretation"],
    ai: ["Estimator implementation", "Code generation & debugging", "Output formatting", "Standard error computation"],
    humanPct: 50,
    tag: "PRE-COMMITTED",
    tagColor: "#7c3aed",
    desc: "Primary specification locked in Condition 3 before first run. AI executes; researcher interprets.",
    checkpoint: "Condition 3: Pre-Commitment Statement locked?",
  },
  {
    id: 5,
    label: "Stage 5",
    title: "Robustness &\nExtensions",
    icon: "◇",
    human: ["Identify meaningful checks", "Adjudicate conflicting results", "Flag exploratory analyses"],
    ai: ["Execute pre-specified checks", "Subgroup analysis code", "Sensitivity table generation"],
    humanPct: 40,
    tag: "AI-ASSISTED",
    tagColor: "#059669",
    desc: "Only pre-specified robustness checks run in this phase. Post-hoc checks labeled exploratory.",
    checkpoint: null,
  },
  {
    id: 6,
    label: "Stage 6",
    title: "Writing",
    icon: "✦",
    human: ["All causal claims", "Identification argument", "Mechanism interpretation", "Contribution statement"],
    ai: ["Coefficient descriptions", "Table/figure formatting", "Reference formatting", "Inline editorial comments only"],
    humanPct: 65,
    tag: "COMMENT NOT REWRITE",
    tagColor: "#b45309",
    desc: "AI comments on researcher's draft; never rewrites causal claims or identification logic.",
    checkpoint: "Can you defend every paragraph without referring to AI output?",
  },
  {
    id: 7,
    label: "Stage 7",
    title: "Review &\nRevision",
    icon: "◑",
    human: ["Strategic response decisions", "Referee priority judgment", "Identification defense"],
    ai: ["Parse referee comments into tasks", "Build dependency DAG", "Flag inter-referee conflicts"],
    humanPct: 55,
    tag: "AI-ASSISTED",
    tagColor: "#059669",
    desc: "Strategic Revision skill structures R&R tasks; researcher owns the strategy.",
    checkpoint: null,
  },
  {
    id: 8,
    label: "Stage 8",
    title: "Dissemination\n& Replication",
    icon: "○",
    human: ["Transparency standard judgment", "Replication package curation"],
    ai: ["Replication script generation", "Visualization polish", "README drafting"],
    humanPct: 30,
    tag: "AI-HEAVY",
    tagColor: "#059669",
    desc: "Full replication package from raw data to all tables/figures. Enables adversarial re-execution by others.",
    checkpoint: null,
  },
];

const irpComponents = [
  { label: "Stage Zero", color: "#dc2626", stages: [0] },
  { label: "Analysis Contract", color: "#7c3aed", stages: [2, 3, 4] },
  { label: "Comment, Don't Rewrite", color: "#b45309", stages: [6] },
  { label: "Independent Review", color: "#0891b2", stages: [2, 4, 6] },
];

const tagColors = {
  "GATE": { bg: "#fee2e2", border: "#dc2626", text: "#991b1b" },
  "HUMAN-LED": { bg: "#dbeafe", border: "#2563eb", text: "#1e40af" },
  "ANALYSIS CONTRACT": { bg: "#ede9fe", border: "#7c3aed", text: "#5b21b6" },
  "AI-HEAVY": { bg: "#d1fae5", border: "#059669", text: "#065f46" },
  "PRE-COMMITTED": { bg: "#ede9fe", border: "#7c3aed", text: "#5b21b6" },
  "AI-ASSISTED": { bg: "#d1fae5", border: "#059669", text: "#065f46" },
  "COMMENT NOT REWRITE": { bg: "#fef3c7", border: "#b45309", text: "#92400e" },
};

function WorkflowDiagram() {
  const [selected, setSelected] = useState(null);
  const [hoveredStage, setHoveredStage] = useState(null);

  const active = selected !== null ? stages[selected] : null;

  return (
    <div style={{
      fontFamily: "'Georgia', 'Times New Roman', serif",
      background: "#0f172a",
      minHeight: "100vh",
      color: "#e2e8f0",
      padding: "32px 24px",
    }}>

      {/* Header */}
      <div style={{ textAlign: "center", marginBottom: 36 }}>
        <div style={{
          display: "inline-block",
          background: "linear-gradient(135deg, #1e3a5f 0%, #1a1f35 100%)",
          border: "1px solid #334155",
          borderRadius: 12,
          padding: "24px 48px",
          marginBottom: 12,
        }}>
          <div style={{ fontSize: 11, letterSpacing: 4, color: "#64748b", textTransform: "uppercase", marginBottom: 8 }}>
            Integrated Research Protocol
          </div>
          <h1 style={{ margin: 0, fontSize: 26, fontWeight: "normal", color: "#f1f5f9", letterSpacing: -0.5 }}>
            Human–AI Interactive Workflow Architecture
          </h1>
          <div style={{ marginTop: 8, fontSize: 13, color: "#94a3b8", fontStyle: "italic" }}>
            AI-Assisted Empirical Economics · Governance Framework
          </div>
        </div>
      </div>

      {/* Legend */}
      <div style={{
        display: "flex", gap: 24, justifyContent: "center",
        marginBottom: 28, flexWrap: "wrap",
      }}>
        {[
          { color: "#3b82f6", label: "Human judgment (non-deprecated skill)" },
          { color: "#10b981", label: "AI execution (deprecated skill)" },
          { color: "#8b5cf6", label: "IRP governance checkpoint" },
          { color: "#f59e0b", label: "Mandatory gate / pre-commitment" },
        ].map(l => (
          <div key={l.label} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}>
            <div style={{ width: 12, height: 12, borderRadius: 2, background: l.color, flexShrink: 0 }} />
            <span style={{ color: "#94a3b8" }}>{l.label}</span>
          </div>
        ))}
      </div>

      {/* Swimlane Labels */}
      <div style={{ display: "flex", marginBottom: 4, paddingLeft: 80 }}>
        <div style={{ flex: 1, textAlign: "center", fontSize: 11, letterSpacing: 2, color: "#3b82f6", textTransform: "uppercase" }}>
          ▲ HUMAN JUDGMENT LANE
        </div>
        <div style={{ flex: 1, textAlign: "center", fontSize: 11, letterSpacing: 2, color: "#10b981", textTransform: "uppercase" }}>
          ▼ AI EXECUTION LANE
        </div>
      </div>

      {/* Main Pipeline */}
      <div style={{ overflowX: "auto", paddingBottom: 8 }}>
        <div style={{ minWidth: 900 }}>

          {/* Stage cards row */}
          <div style={{ display: "flex", gap: 6, alignItems: "stretch" }}>

            {/* Y-axis labels */}
            <div style={{
              width: 72, flexShrink: 0,
              display: "flex", flexDirection: "column", justifyContent: "space-between",
              paddingTop: 4, paddingBottom: 4,
            }}>
              <div style={{ fontSize: 10, color: "#3b82f6", textAlign: "right", paddingRight: 8 }}>Human</div>
              <div style={{ fontSize: 10, color: "#64748b", textAlign: "right", paddingRight: 8 }}>Split</div>
              <div style={{ fontSize: 10, color: "#10b981", textAlign: "right", paddingRight: 8 }}>AI</div>
            </div>

            {stages.map((stage, i) => {
              const tc = tagColors[stage.tag] || { bg: "#f1f5f9", border: "#94a3b8", text: "#374151" };
              const isSelected = selected === i;
              const isHovered = hoveredStage === i;

              return (
                <div
                  key={i}
                  onClick={() => setSelected(isSelected ? null : i)}
                  onMouseEnter={() => setHoveredStage(i)}
                  onMouseLeave={() => setHoveredStage(null)}
                  style={{
                    flex: 1,
                    minWidth: 88,
                    cursor: "pointer",
                    borderRadius: 10,
                    border: `2px solid ${isSelected ? "#f59e0b" : isHovered ? "#475569" : "#1e293b"}`,
                    background: isSelected
                      ? "linear-gradient(180deg, #1c2d4f 0%, #1a2940 100%)"
                      : "linear-gradient(180deg, #1e293b 0%, #0f172a 100%)",
                    transition: "all 0.18s ease",
                    transform: isSelected ? "translateY(-2px)" : "none",
                    boxShadow: isSelected ? "0 8px 24px rgba(245,158,11,0.15)" : "none",
                    overflow: "hidden",
                    display: "flex", flexDirection: "column",
                  }}
                >
                  {/* Stage header */}
                  <div style={{
                    padding: "8px 10px 6px",
                    borderBottom: "1px solid #1e293b",
                    background: stage.id === 0 ? "rgba(220,38,38,0.15)" : "rgba(255,255,255,0.02)",
                  }}>
                    <div style={{ fontSize: 10, color: "#64748b", letterSpacing: 1 }}>{stage.label}</div>
                    <div style={{ fontSize: 18, lineHeight: 1, marginTop: 2 }}>{stage.icon}</div>
                    <div style={{
                      fontSize: 11, fontWeight: "bold", color: "#e2e8f0",
                      marginTop: 4, lineHeight: 1.3,
                      whiteSpace: "pre-line",
                    }}>
                      {stage.title}
                    </div>
                  </div>

                  {/* Human/AI split bar */}
                  <div style={{ padding: "6px 10px 2px" }}>
                    <div style={{
                      height: 6, borderRadius: 3,
                      background: `linear-gradient(90deg, #3b82f6 ${stage.humanPct}%, #10b981 ${stage.humanPct}%)`,
                      opacity: 0.85,
                    }} />
                    <div style={{
                      display: "flex", justifyContent: "space-between",
                      marginTop: 2, fontSize: 9, color: "#64748b",
                    }}>
                      <span style={{ color: "#60a5fa" }}>{stage.humanPct}%</span>
                      <span style={{ color: "#34d399" }}>{100 - stage.humanPct}%</span>
                    </div>
                  </div>

                  {/* Tag */}
                  <div style={{ padding: "4px 10px 6px" }}>
                    <div style={{
                      display: "inline-block",
                      padding: "2px 6px",
                      borderRadius: 4,
                      fontSize: 8,
                      fontWeight: "bold",
                      letterSpacing: 0.5,
                      background: tc.bg,
                      color: tc.text,
                      border: `1px solid ${tc.border}`,
                      opacity: 0.9,
                    }}>
                      {stage.tag}
                    </div>
                  </div>

                  {/* Checkpoint indicator */}
                  {stage.checkpoint && (
                    <div style={{
                      margin: "0 10px 6px",
                      padding: "4px 6px",
                      borderRadius: 4,
                      background: "rgba(245,158,11,0.12)",
                      border: "1px solid rgba(245,158,11,0.3)",
                      fontSize: 9,
                      color: "#fbbf24",
                      lineHeight: 1.4,
                    }}>
                      ⬡ {stage.checkpoint.length > 60 ? stage.checkpoint.slice(0, 57) + "…" : stage.checkpoint}
                    </div>
                  )}

                  {/* Expand hint */}
                  <div style={{
                    marginTop: "auto",
                    padding: "4px 10px 6px",
                    fontSize: 9,
                    color: isSelected ? "#f59e0b" : "#334155",
                    textAlign: "center",
                  }}>
                    {isSelected ? "▲ collapse" : "▼ details"}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Flow arrows between stages */}
          <div style={{ display: "flex", alignItems: "center", paddingLeft: 80, marginTop: 4, gap: 6 }}>
            {stages.map((_, i) => (
              <div key={i} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "flex-end" }}>
                {i < stages.length - 1 && (
                  <div style={{ fontSize: 16, color: "#334155" }}>→</div>
                )}
              </div>
            ))}
          </div>

        </div>
      </div>

      {/* Detail panel */}
      {active && (
        <div style={{
          marginTop: 20,
          background: "linear-gradient(135deg, #1e293b 0%, #0f172a 100%)",
          border: "1px solid #f59e0b",
          borderRadius: 12,
          padding: 24,
          animation: "fadeIn 0.2s ease",
        }}>
          <style>{`@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }`}</style>

          <div style={{ display: "flex", gap: 32, flexWrap: "wrap" }}>

            {/* Stage info */}
            <div style={{ flex: "0 0 220px" }}>
              <div style={{ fontSize: 11, color: "#64748b", letterSpacing: 2, marginBottom: 4 }}>
                {active.label} · {active.icon}
              </div>
              <div style={{ fontSize: 20, fontWeight: "bold", color: "#f1f5f9", whiteSpace: "pre-line", lineHeight: 1.3 }}>
                {active.title}
              </div>
              <div style={{ marginTop: 12, fontSize: 13, color: "#94a3b8", lineHeight: 1.6 }}>
                {active.desc}
              </div>

              {/* Split visualization */}
              <div style={{ marginTop: 16 }}>
                <div style={{ fontSize: 11, color: "#64748b", marginBottom: 6 }}>SKILL LOAD</div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 10, color: "#60a5fa", marginBottom: 3 }}>Human {active.humanPct}%</div>
                    <div style={{ height: 8, borderRadius: 4, background: "#1e293b" }}>
                      <div style={{ height: "100%", width: `${active.humanPct}%`, borderRadius: 4, background: "linear-gradient(90deg, #2563eb, #60a5fa)" }} />
                    </div>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 4 }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 10, color: "#34d399", marginBottom: 3 }}>AI {100 - active.humanPct}%</div>
                    <div style={{ height: 8, borderRadius: 4, background: "#1e293b" }}>
                      <div style={{ height: "100%", width: `${100 - active.humanPct}%`, borderRadius: 4, background: "linear-gradient(90deg, #059669, #34d399)" }} />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Human tasks */}
            <div style={{ flex: 1, minWidth: 180 }}>
              <div style={{
                fontSize: 11, letterSpacing: 2, color: "#3b82f6",
                textTransform: "uppercase", marginBottom: 10,
                display: "flex", alignItems: "center", gap: 6,
              }}>
                <div style={{ width: 8, height: 8, borderRadius: 2, background: "#3b82f6" }} />
                Human Judgment (Non-Deprecated)
              </div>
              {active.human.length > 0 ? active.human.map((t, i) => (
                <div key={i} style={{
                  display: "flex", alignItems: "flex-start", gap: 8,
                  marginBottom: 8, fontSize: 13, color: "#cbd5e1", lineHeight: 1.5,
                }}>
                  <div style={{
                    width: 18, height: 18, borderRadius: "50%",
                    background: "rgba(59,130,246,0.15)", border: "1px solid #3b82f6",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 9, color: "#60a5fa", flexShrink: 0, marginTop: 1,
                  }}>H</div>
                  {t}
                </div>
              )) : (
                <div style={{ fontSize: 13, color: "#ef4444", fontStyle: "italic" }}>
                  ✕ No AI. Human only.
                </div>
              )}
            </div>

            {/* AI tasks */}
            <div style={{ flex: 1, minWidth: 180 }}>
              <div style={{
                fontSize: 11, letterSpacing: 2, color: "#10b981",
                textTransform: "uppercase", marginBottom: 10,
                display: "flex", alignItems: "center", gap: 6,
              }}>
                <div style={{ width: 8, height: 8, borderRadius: 2, background: "#10b981" }} />
                AI Execution (Deprecated Skills)
              </div>
              {active.ai.length > 0 ? active.ai.map((t, i) => (
                <div key={i} style={{
                  display: "flex", alignItems: "flex-start", gap: 8,
                  marginBottom: 8, fontSize: 13, color: "#cbd5e1", lineHeight: 1.5,
                }}>
                  <div style={{
                    width: 18, height: 18, borderRadius: "50%",
                    background: "rgba(16,185,129,0.15)", border: "1px solid #10b981",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 9, color: "#34d399", flexShrink: 0, marginTop: 1,
                  }}>A</div>
                  {t}
                </div>
              )) : (
                <div style={{ fontSize: 13, color: "#94a3b8", fontStyle: "italic" }}>
                  — No AI involvement at this stage
                </div>
              )}
            </div>

            {/* Checkpoint */}
            {active.checkpoint && (
              <div style={{ flex: "0 0 220px" }}>
                <div style={{ fontSize: 11, letterSpacing: 2, color: "#f59e0b", textTransform: "uppercase", marginBottom: 10 }}>
                  IRP Checkpoint
                </div>
                <div style={{
                  background: "rgba(245,158,11,0.08)",
                  border: "1px solid rgba(245,158,11,0.4)",
                  borderRadius: 8,
                  padding: 12,
                  fontSize: 12, color: "#fde68a", lineHeight: 1.6,
                }}>
                  <div style={{ marginBottom: 6, fontSize: 16 }}>⬡</div>
                  {active.checkpoint}
                </div>
                <div style={{ marginTop: 8, fontSize: 11, color: "#64748b", lineHeight: 1.5 }}>
                  Failure to pass this checkpoint requires returning to design stage or reframing as descriptive analysis.
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* IRP Components banner */}
      <div style={{ marginTop: 24 }}>
        <div style={{ fontSize: 11, letterSpacing: 3, color: "#64748b", textTransform: "uppercase", textAlign: "center", marginBottom: 12 }}>
          IRP Governance Layer
        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", justifyContent: "center" }}>
          {[
            {
              label: "Stage Zero",
              sub: "Cognitive Crystallization",
              color: "#dc2626",
              bg: "rgba(220,38,38,0.08)",
              desc: "4 questions. Own words. No AI. Prerequisite for everything.",
              icon: "◈",
            },
            {
              label: "Analysis Contract",
              sub: "3 Pre-Conditions",
              color: "#7c3aed",
              bg: "rgba(124,58,237,0.08)",
              desc: "Method-Data Contract · Data Audit · Pre-Commitment Statement",
              icon: "◈",
            },
            {
              label: "Comment, Don't Rewrite",
              sub: "Writing Principle",
              color: "#b45309",
              bg: "rgba(180,83,9,0.08)",
              desc: "AI inserts inline comments only. Researcher authors all causal claims.",
              icon: "✦",
            },
            {
              label: "Independent Review",
              sub: "Adversarial Audit",
              color: "#0891b2",
              bg: "rgba(8,145,178,0.08)",
              desc: "Adversarial AI review or peer code audit before dissemination.",
              icon: "◑",
            },
          ].map(c => (
            <div key={c.label} style={{
              flex: "1 1 200px", maxWidth: 260,
              background: c.bg,
              border: `1px solid ${c.color}44`,
              borderRadius: 10,
              padding: "14px 16px",
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                <div style={{ fontSize: 16, color: c.color }}>{c.icon}</div>
                <div>
                  <div style={{ fontSize: 13, fontWeight: "bold", color: c.color }}>{c.label}</div>
                  <div style={{ fontSize: 10, color: "#64748b" }}>{c.sub}</div>
                </div>
              </div>
              <div style={{ fontSize: 11, color: "#94a3b8", lineHeight: 1.6 }}>{c.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Skill depreciation legend */}
      <div style={{
        marginTop: 20,
        background: "rgba(255,255,255,0.02)",
        border: "1px solid #1e293b",
        borderRadius: 10,
        padding: "16px 24px",
        display: "flex", gap: 48, flexWrap: "wrap", justifyContent: "center",
      }}>
        <div>
          <div style={{ fontSize: 11, color: "#3b82f6", letterSpacing: 2, marginBottom: 8 }}>NON-DEPRECATED SKILLS (Human)</div>
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            {["Question taste", "Identification credibility", "Institutional knowledge", "Argument iteration"].map(s => (
              <span key={s} style={{
                fontSize: 11, color: "#cbd5e1",
                background: "rgba(59,130,246,0.08)",
                border: "1px solid rgba(59,130,246,0.2)",
                borderRadius: 4, padding: "3px 8px",
              }}>{s}</span>
            ))}
          </div>
        </div>
        <div>
          <div style={{ fontSize: 11, color: "#10b981", letterSpacing: 2, marginBottom: 8 }}>DEPRECATED SKILLS (AI)</div>
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            {["Coding", "Data wrangling", "Prose generation", "Literature search"].map(s => (
              <span key={s} style={{
                fontSize: 11, color: "#cbd5e1",
                background: "rgba(16,185,129,0.08)",
                border: "1px solid rgba(16,185,129,0.2)",
                borderRadius: 4, padding: "3px 8px",
              }}>{s}</span>
            ))}
          </div>
        </div>
      </div>

      {/* Footer */}
      <div style={{ textAlign: "center", marginTop: 20, fontSize: 11, color: "#334155" }}>
        Click any stage card to expand details · IRP: Integrated Research Protocol for AI-Assisted Empirical Economics
      </div>

    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<WorkflowDiagram/>);
</script></body></html>
